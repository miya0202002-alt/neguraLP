name: Repair negura gallery and security

on:
  push:
    branches:
      - fix/security-gallery-no-ui

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-gallery-no-ui
          fetch-depth: 0

      - name: Apply minimal no-UI repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          API_KEY = 'JBZauYMG32ZhnKgLZqoX7Puue4epAIzjkqit'

          gallery_entries = """            var images = [
                { src: 'assets/images/rectangle_large_type_2_1aa3de3079240d9b2a11c064285858c3.jpeg', alt: 'negura gallery 0' },
                { src: 'assets/images/1769775909-gsWS1rIGxmozHjNtKBuUeFi9.webp', alt: 'negura gallery 1' },
                { src: 'assets/images/1769514092-72QcgXwAhZlieCjsW5mbENDr.webp', alt: 'negura gallery 2' },
                { src: 'assets/images/1769775526-kMBQm8bgp9iITlDh2UOF5YRr.webp', alt: 'negura gallery 3' }
            ];"""

          sanitizer = r'''                function formatNewsContent(text) {
                    if (!text) return '';
                    var s = String(text);

                    if (/<a\s/i.test(s)) {
                        var source = document.createElement('div');
                        var output = document.createElement('div');
                        source.innerHTML = s;

                        Array.from(source.childNodes).forEach(function (node) {
                            if (node.nodeType === Node.TEXT_NODE) {
                                output.appendChild(document.createTextNode(node.textContent || ''));
                                return;
                            }

                            if (node.nodeType === Node.ELEMENT_NODE && node.tagName === 'A') {
                                var href = node.getAttribute('href') || '';
                                if (/^https?:\/\//i.test(href)) {
                                    var safeLink = document.createElement('a');
                                    safeLink.href = href;
                                    safeLink.target = '_blank';
                                    safeLink.rel = 'noopener noreferrer';
                                    safeLink.className = 'text-[#92905D] underline hover:opacity-80';
                                    safeLink.textContent = node.textContent || href;
                                    output.appendChild(safeLink);
                                } else {
                                    output.appendChild(document.createTextNode(node.textContent || ''));
                                }
                                return;
                            }

                            output.appendChild(document.createTextNode(node.textContent || ''));
                        });

                        return output.innerHTML;
                    }

                    s = s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;').replace(/'/g, '&#39;');
                    return s.replace(/(https?:\/\/[^\s<>\"']+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer" class="text-[#92905D] underline hover:opacity-80">$1</a>');
                }'''

          for filename in ('index.html', 'index-en.html'):
              p = Path(filename)
              before = p.read_text(encoding='utf-8')
              text = before

              # Restore the last known-good gallery images while keeping the current UI markup unchanged.
              text, count = re.subn(
                  r"            var images = \[.*?\n            \];",
                  gallery_entries,
                  text,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit(f'{filename}: gallery array replacement count={count}')

              # Fix the existing carousel animation ReferenceError without changing layout or styling.
              marker = "            var rightImg = document.getElementById('gallery-right-img');\n"
              track_line = "            var track = document.getElementById('gallery-track');\n"
              if track_line not in text:
                  if marker not in text:
                      raise SystemExit(f'{filename}: gallery rightImg marker not found')
                  text = text.replace(marker, marker + track_line, 1)

              # Sanitize CMS-provided HTML while preserving the existing link appearance and behavior.
              text, count = re.subn(
                  r"                function formatNewsContent\(text\) \{.*?\n                \}",
                  sanitizer,
                  text,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit(f'{filename}: formatNewsContent replacement count={count}')

              # User requirement: API key must remain exactly unchanged.
              if before.count(API_KEY) != text.count(API_KEY) or API_KEY not in text:
                  raise SystemExit(f'{filename}: microCMS API key changed unexpectedly')

              p.write_text(text, encoding='utf-8')

          # Add non-visual HTTP hardening headers. Avoid CSP here because the current site intentionally
          # depends on inline scripts and Tailwind CDN; a strict CSP could change/break the UI.
          vp = Path('vercel.json')
          config = json.loads(vp.read_text(encoding='utf-8'))
          config['headers'] = [
              {
                  'source': '/(.*)',
                  'headers': [
                      {'key': 'X-Content-Type-Options', 'value': 'nosniff'},
                      {'key': 'Referrer-Policy', 'value': 'strict-origin-when-cross-origin'},
                      {'key': 'Permissions-Policy', 'value': 'camera=(), microphone=(), geolocation=()'},
                      {'key': 'X-Frame-Options', 'value': 'SAMEORIGIN'},
                  ],
              }
          ]
          vp.write_text(json.dumps(config, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          gp = Path('.gitignore')
          gi = gp.read_text(encoding='utf-8')
          additions = ['.env*', '*.pem', '.vercel/']
          for item in additions:
              if item not in gi.splitlines():
                  gi += ('\n' if gi and not gi.endswith('\n') else '') + item + '\n'
          gp.write_text(gi, encoding='utf-8')
          PY

      - name: Verify no UI-facing markup was altered unintentionally
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          key = 'JBZauYMG32ZhnKgLZqoX7Puue4epAIzjkqit'
          expected = [
              'assets/images/rectangle_large_type_2_1aa3de3079240d9b2a11c064285858c3.jpeg',
              'assets/images/1769775909-gsWS1rIGxmozHjNtKBuUeFi9.webp',
              'assets/images/1769514092-72QcgXwAhZlieCjsW5mbENDr.webp',
              'assets/images/1769775526-kMBQm8bgp9iITlDh2UOF5YRr.webp',
          ]
          missing_names = [
              '3147dd47-e419-4f31-bcec-1a064e4c7cba.avif',
              '9715a20c-cf6f-4eb5-90aa-bf773e7cdbbd.avif',
              '36404a13-87d1-41a9-bfdf-f43a4ca66271.avif',
          ]

          for filename in ('index.html', 'index-en.html'):
              text = Path(filename).read_text(encoding='utf-8')
              assert key in text, f'{filename}: API key missing'
              assert "var track = document.getElementById('gallery-track');" in text, f'{filename}: track fix missing'
              assert 'if (/<a\\s/i.test(s)) return s;' not in text, f'{filename}: unsafe passthrough still present'
              for image in expected:
                  assert image in text, f'{filename}: restored gallery image missing: {image}'
              for image in missing_names:
                  assert image not in text, f'{filename}: broken gallery image still referenced: {image}'

          print('Static verification passed')
          PY

      - name: Commit repair if needed
        shell: bash
        run: |
          git config user.name "negura-security-repair"
          git config user.email "actions@users.noreply.github.com"
          git add index.html index-en.html vercel.json .gitignore
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix gallery references and harden CMS rendering"
          git push origin HEAD:fix/security-gallery-no-ui
